packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts. Everything else is blocked.
allowBuilds:
  sharp: true
  unrs-resolver: true
  prisma: true
  "@prisma/engines": true
  msgpackr-extract: true
  # Not needed: optional SSH transport of dockerode, esbuild ships its binary as a
  # platform package, and protobufjs's script only prints a notice.
  cpu-features: false
  ssh2: false
  esbuild: false
  protobufjs: false

# Security fixes for transitive dependencies of the Prisma CLI (pulled in as a
# peer of @prisma/client). mysql2 is never used (the database is Postgres).
overrides:
  deepmerge-ts: ">=8.0.0"
  mysql2: ">=3.23.1"
