# Local infrastructure. The web app, API and worker run on the host via `pnpm dev`;
# sandboxed programs run in short-lived containers started by the worker.
name: code-workspace

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cw
      POSTGRES_PASSWORD: cw_local_dev
      POSTGRES_DB: code_workspace
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cw -d code_workspace"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
