# Production stack for one Docker-capable Linux server.
#
#   internet ──443/80──▶ web (Caddy: TLS, static IDE, /api + /ws proxy)
#                          │ edge network
#                          ▼
#                         api ──────────┐ backend network (internal: no internet)
#                                       ├── redis     (queue, live events)
#                         worker ───────┼── postgres  (execution records)
#                           │           └──
#                           ▼ /var/run/docker.sock
#                     host Docker Engine ──▶ one sandbox container per run
#
# Only `web` publishes ports. The API never runs user code; it only queues it.
# The worker is the only service that can reach Docker, has no published
# ports and no internet access, and runs code only inside sandbox containers
# (no network, non-root, read-only rootfs, CPU/memory/PID/output/time limits).
#
# Required variables (see deploy/.env.production.example):
#   PUBLIC_HOST, POSTGRES_PASSWORD, CLIENT_HASH_SALT, DOCKER_GID, IMAGE_TAG

name: writecode

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  web:
    image: writecode/web:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      # Certificates and ACME account; must persist across deployments.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    mem_limit: 256m
    logging: *logging

  api:
    image: writecode/api:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://cw:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/code_workspace
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: https://${PUBLIC_HOST},https://www.${PUBLIC_HOST}
      CLIENT_HASH_SALT: ${CLIENT_HASH_SALT:?set CLIENT_HASH_SALT}
      TRUST_PROXY: "1"
      # Optional AI assistant. Only the API holds the key; the browser never sees it.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      GEMINI_FAST_MODELS: ${GEMINI_FAST_MODELS:-}
      # Optional: email invitations through Resend (the key stays on the server).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Optional: the camera relay below. The API signs short-lived credentials with the secret.
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [edge, backend]
    # Ceilings so one service cannot starve the others; sandboxes have their own limits.
    mem_limit: 1g
    logging: *logging

  # Camera relay for interviews (TURN): when two browsers cannot reach each other directly
  # (strict office and college networks), the picture and sound pass through here.
  # Started only with the "turn" profile, i.e. when TURN_SECRET is set (see deploy.sh).
  # Host networking: a relay hands out UDP ports, which Docker's port mapping handles badly.
  # Open in the firewall: 3478/udp, 3478/tcp and 49160-49259/udp.
  turn:
    image: coturn/coturn:4.6-alpine
    profiles: [turn]
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=49160
      - --max-port=49259
      - --realm=${PUBLIC_HOST}
      # Credentials are signed by the API with this secret and expire; there are no accounts.
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-unset}
      - --fingerprint
      - --stale-nonce=600
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-tcp-relay
      - --no-multicast-peers
      - --no-software-attribute
      # One interview is two relayed streams; these keep the relay from being used for anything bigger.
      - --user-quota=6
      - --total-quota=80
      - --max-bps=250000
      # Never relay into private networks (this server's own services, Docker's networks, the cloud's metadata address).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=224.0.0.0-255.255.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    read_only: true
    tmpfs: [/var/lib/coturn, /tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The image's binary is marked as able to use low ports; without this it cannot start at all.
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 192m
    logging: *logging

  worker:
    image: writecode/worker:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    # Give sandboxes time to finish and be removed on shutdown.
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cw:${POSTGRES_PASSWORD}@postgres:5432/code_workspace
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DEBUG_CONCURRENCY: ${DEBUG_CONCURRENCY:-2}
      # Empty uses runc. runsc (gVisor) is possible but loses typed-input wait
      # detection; see deploy/.env.production.example.
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket's group on the host (stat -c %g /var/run/docker.sock), so the worker runs as non-root.
    group_add: ["${DOCKER_GID:?set DOCKER_GID}"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    mem_limit: 1g
    logging: *logging

  migrate:
    image: writecode/migrate:${IMAGE_TAG}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://cw:${POSTGRES_PASSWORD}@postgres:5432/code_workspace
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1536mb", "--maxmemory-policy", "noeviction"]
    # Headroom above maxmemory for append-only-file rewrites.
    mem_limit: 2g
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: code_workspace
    volumes: [postgres_data:/var/lib/postgresql/data]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cw -d code_workspace"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    logging: *logging

networks:
  edge: {}
  # No route to the internet: the worker talks only to Redis, Postgres and the Docker socket.
  backend:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  redis_data: {}
  postgres_data: {}
