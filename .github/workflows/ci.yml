name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.6.0

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  execution:
    name: Real execution in Docker sandboxes (${{ matrix.runner }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        # arm64 matches the Oracle Cloud Always Free Ampere VM used for hosting.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cw
          POSTGRES_PASSWORD: cw_local_dev
          POSTGRES_DB: code_workspace
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cw" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Pull sandbox images
        run: |
          for image in eclipse-temurin:21-jdk python:3.13-slim gcc:14 node:22-slim; do docker pull -q "$image"; done
      - name: Execution matrix, debug adapters and visualizer (real programs, real limits)
        run: pnpm --filter @cw/worker test
        env:
          E2E_EXECUTION: "1"

  images:
    name: Production images (${{ matrix.runner }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api, worker, migrate and web images
        run: |
          for target in api worker migrate web; do
            docker build --target "$target" -t "writecode/$target:ci" .
          done
      - name: Validate the Caddyfile and compose file
        run: |
          docker run --rm -e PUBLIC_HOST=writecode.in -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          PUBLIC_HOST=writecode.in POSTGRES_PASSWORD=x CLIENT_HASH_SALT=x DOCKER_GID=999 IMAGE_TAG=ci docker compose -f deploy/docker-compose.prod.yml config --quiet
